name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  example:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        folder: [agent-trace, document-inspector, chat-with-your-files, scoped-workspaces, model-console]
    defaults:
      run:
        working-directory: ${{ matrix.folder }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ${{ matrix.folder }}/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
